name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Python tools
        run: pip install --upgrade pip "cython<3" buildozer virtualenv setuptools
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            android/.buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}
      - name: Prepare sources
        run: python android/prepare.py
      - name: Build APK
        working-directory: android
        run: yes | buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramDateStudio-apk
          path: android/bin/*.apk
